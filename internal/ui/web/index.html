<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fluxexp</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="rail">
    <button id="drawer" class="drawer-btn" type="button" aria-expanded="false" aria-controls="tree">☰ tree</button>
    <div class="brand">flux<i>exp</i></div>
    <div class="sep" aria-hidden="true"></div>
    <div class="ctx">
      <label class="lbl" for="context">context</label>
      <select id="context"></select>
    </div>
    <div class="filter">
      <input id="q" class="field" type="search" placeholder="filter by name…" aria-label="Filter by kind, namespace or name">
      <div id="hfilter" class="hfilter" role="group" aria-label="Filter by health"></div>
    </div>
  </header>

  <div class="shell">
    <nav id="tree" class="tree" aria-label="Resource tree"></nav>
    <main class="detail"><div id="view" class="detail-inner"></div></main>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
