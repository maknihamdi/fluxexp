apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluxexp
spec:
  # NO `replicas`. The HorizontalPodAutoscaler owns the count; a Deployment that
  # also declares it is reset on every apply and scaled back by the autoscaler —
  # a flap that costs a rollout each time, permanently, when a reconciler
  # re-applies the manifest.
  selector: {}  # generated by kustomize from the common labels
  template:
    metadata: {}
    spec:
      serviceAccountName: fluxexp
      # Two replicas on one node make the PodDisruptionBudget decorative, since a
      # single drain violates it. ScheduleAnyway spreads them when the cluster
      # allows and never blocks scheduling when it cannot.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          # Explicit for the same reason as the PDB's: the transformer does not
          # reach here, and an empty selector would spread against every pod in
          # the namespace rather than this Deployment's.
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: fluxexp
      containers:
        - name: fluxexp
          # 0.4.0 is the first release carrying the in-cluster context listing
          # this change adds. Pinning 0.3.0 would deploy the very bug the change
          # fixes: the portal would come up with an empty context selector.
          # Consequence to know: between this commit and the v0.4.0 tag, applying
          # the base gives ImagePullBackOff.
          image: quay.io/hamdi_makni/fluxexp:0.4.0
          imagePullPolicy: IfNotPresent
          # The binary binds loopback by default and that default does not
          # change: being reachable inside the cluster is something this manifest
          # asks for explicitly.
          args: ["ui", "--address", "0.0.0.0:8765"]
          ports:
            - name: http
              containerPort: 8765
          # These assertions are redundant against the image as built, and that
          # is their purpose: they fail loudly if the base image ever stops
          # providing them, instead of a property being lost unnoticed.
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              # No CPU limit. The workload is a burst of tens of concurrent
              # requests followed by idle — the shape CFS throttling punishes
              # hardest, and throttling would undo the rate-limiter work that
              # took a 67-entry layer from 25s to ~1.2s. A memory burst is a
              # leak, not a spike, so that limit stays.
              memory: 256Mi
          # `/` is answered by the embedded file server. These probes assert the
          # HTTP server is serving and deliberately do NOT check cluster
          # reachability: a probe that did would take every replica down during
          # an API-server disruption, when the portal's specified behaviour is to
          # serve and report the failure per node.
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
      # No volumes. Nothing in the process writes to disk — discovery uses the
      # non-caching client — so the read-only root filesystem holds without one.
      # Adding a scratch volume pre-emptively would mask the day something starts
      # writing.
