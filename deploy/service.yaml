apiVersion: v1
kind: Service
metadata:
  name: fluxexp
spec:
  # ClusterIP on purpose. The portal has no authentication and reads the whole
  # cluster: exposing it on a hostname is a decision about an authenticating
  # proxy, not a manifest. Until then, reaching it requires credentials for the
  # cluster itself, via `kubectl port-forward`.
  type: ClusterIP
  ports:
    - name: http
      port: 8765
      targetPort: http
