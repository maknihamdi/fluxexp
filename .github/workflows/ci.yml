name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Nothing here writes to the repository: the only artifact leaves for an external
# registry. The default token grant is wider than that.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # go.mod is the single declaration of the toolchain version. Pinning it
          # here too would be a second place to bump, and the two would drift.
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      # The Makefile already defines what these mean. Restating `go test ./...`
      # here would create a second definition that can disagree with the one a
      # developer runs locally.
      - run: make vet
      - run: make test
      - run: make build

      - uses: docker/setup-buildx-action@v3

      # Build the image without pushing it, so a broken Dockerfile is caught on a
      # pull request instead of at tag time, when it would fail a release.
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false

  publish:
    needs: validate
    # On the ref, not on the event name: a tag push is a `push` event too, so
    # gating on the event would publish for every merge to main.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The `latest` decision below compares this tag against the others, so
          # the tags have to be here. It is the only reason for a full clone.
          fetch-depth: 0

      # metadata-action sees only the ref that triggered the run: it queries
      # neither the repository's other tags nor the registry, so it cannot know
      # that v1.3.5 is a patch on an older line than an already-released v1.4.2.
      # That comparison is made here and nowhere else.
      - name: Decide whether this tag is the highest released version
        id: latest
        run: |
          # sed drops prereleases; `grep -v -- -` would pass a lone dash as the
          # pattern, which not every grep accepts.
          highest=$(git tag -l 'v*' --sort=-v:refname | sed '/-/d' | head -n1)
          if [ "$highest" = "$GITHUB_REF_NAME" ]; then
            echo "latest=true"
          else
            echo "latest=false"
          fi >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: quay.io/hamdi_makni/fluxexp
          # Off, so the action's own rule cannot add `latest` behind the decision
          # made in the step above.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.latest.outputs.latest }}

      - uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # So the binary's --version agrees with the image's version label.
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          # OCI labels: source, revision, version, created. `--version` names the
          # release; only the labels name the commit it was built from.
          labels: ${{ steps.meta.outputs.labels }}

  build-binaries:
    needs: validate
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # No permissions block: a build needs nothing beyond the read-only default.
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Every target is a plain cross-compile on this one runner: the binary is
      # static and the frontend is embedded, so no target needs a native runner
      # or a C toolchain.
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME#v}"
          binary=fluxexp
          # An `&&` here would exit the step for every non-Windows target, since
          # a false test makes the whole compound command fail under `bash -e`.
          if [ "$GOOS" = windows ]; then
            binary=fluxexp.exe
          fi
          go build -ldflags "-X main.version=${version}" -o "$binary" ./cmd/fluxexp
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "BINARY=${binary}" >> "$GITHUB_ENV"

      # Only the native target can be executed here. It catches a broken ldflags
      # path, which is the failure that is not platform-specific — the other four
      # archives are published without ever being run.
      - name: Smoke-test the native build
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          got=$(./fluxexp --version)
          echo "$got"
          case "$got" in
            *"$VERSION"*) ;;
            *) echo "expected version $VERSION in: $got"; exit 1 ;;
          esac

      - name: Archive
        run: |
          name="fluxexp_${VERSION}_${GOOS}_${GOARCH}"
          # LICENSE travels inside the archive: a downloaded file carries no link
          # back to the repository.
          if [ "$GOOS" = windows ]; then
            zip -q "${name}.zip" "$BINARY" LICENSE
            echo "ARCHIVE=${name}.zip" >> "$GITHUB_ENV"
          else
            tar czf "${name}.tar.gz" "$BINARY" LICENSE
            echo "ARCHIVE=${name}.tar.gz" >> "$GITHUB_ENV"
          fi
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}
          retention-days: 1

  release:
    needs: build-binaries
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # The only job that writes to the repository. The workflow default stays
    # read-only, so the jobs holding registry credentials and the job able to
    # write here are disjoint sets.
    permissions:
      contents: write
    steps:
      # Before the download: checkout cleans the workspace, so it would remove
      # `dist/`. Only the installer is needed here, hence the sparse checkout.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: install.sh
          sparse-checkout-cone-mode: false

      # One job creates the release, after all five builds. Publishing from
      # inside the matrix would have five jobs racing to create the same release,
      # and one missing two of its five assets looks complete.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          # Named, not swept: `build-push-action` uploads a `.dockerbuild` build
          # record of its own, so "every artifact in this run" is not this job's
          # five archives — and downloading those records fails outright.
          pattern: fluxexp_*
          merge-multiple: true

      # One file for the whole release: `sha256sum -c` consumes a list, and five
      # one-line files would leave the reader comparing them by hand.
      - name: Checksums
        working-directory: dist
        run: |
          # The installer ships with the release too, so the script that verifies
          # a download is itself verifiable. The `fluxexp_*` glob does not catch
          # it, so it is named — one list, one sum, no way for them to disagree.
          cp ../install.sh .
          sha256sum fluxexp_* install.sh > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
